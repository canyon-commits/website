<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Francesco Trentini",

  }

<style>
:root {
  --bg: #1C001B;
  --text: #F5F5F5;
  --gutter: 20px;
  --bar-height: 50px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  height: 100%;
}

body {
  background-color: var(--bg);
  color: var(--text);
  font-family: Helvetica, Arial, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::selection {
  background: var(--text);
  color: var(--bg);
}

/* Header and footer share one grid so PALO ALTO is truly centred,
   regardless of the different widths of NEW YORK and HONG KONG. */
header,
footer {
  position: fixed;
  left: 0;
  right: 0;
  height: var(--bar-height);
  padding: 0 var(--gutter);
  background-color: var(--bg);
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  z-index: 10;
}

header {
  top: 0;
}

footer {
  bottom: 0;
}

.location {
  text-transform: uppercase;
  font-size: 0.8rem;
  white-space: nowrap;
}

.location.left {
  justify-self: start;
  text-align: left;
}

.location.center {
  justify-self: center;
  text-align: center;
}

.location.right {
  justify-self: end;
  text-align: right;
}

main {
  height: 100vh;
  height: 100dvh;
  position: relative;
}

.description {
  position: absolute;
  left: var(--gutter);
  top: 75%;
  transform: translateY(-50%);
  max-width: 50%;
  font-size: 1rem;
  line-height: 1.6;
  text-align: left;
}

.contact {
  justify-self: start;
}

.contact a {
  font-size: 0.8rem;
  text-transform: uppercase;
  color: var(--text);
  text-decoration: none;
}

.contact a:hover {
  text-decoration: underline;
}

.contact a:focus-visible {
  outline: 1px solid var(--text);
  outline-offset: 4px;
  text-decoration: underline;
}

.copyright {
  justify-self: end;
  font-size: 0.8rem;
}

@media (max-width: 768px) {
  :root {
    --gutter: 10px;
    --bar-height: 40px;
  }

  body {
    font-size: 11px;
  }

  .description {
    max-width: calc(100% - (var(--gutter) * 2));
    top: 70%;
  }
}
</style>
</head>
<body>

<header>
  <div class="location left">New York</div>
  <div class="location center">Palo Alto</div>
  <div class="location right">Hong Kong</div>
</header>

<main>
  <p class="description">Francesco is a technology investor and entrepreneur. He received his education at the London School of Economics and his interests include AI and global macro.</p>
</main>

<footer>
  <div class="contact">
    <a href="mailto:contact@francescotrentini.com">Contact</a>
  </div>
  <div></div>
  <div class="copyright">&copy; <span id="year">2026</span></div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
